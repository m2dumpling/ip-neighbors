<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>IP 邻居 — C段网络地址扫描器</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin/>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;font-size:16px}
body{
  background:#f5f5f7;color:#1d1d1f;
  font-family:'SF Pro Display','SF Pro Text',-apple-system,BlinkMacSystemFont,'Helvetica Neue','Helvetica',sans-serif;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  overflow-x:hidden;
}
::selection{background:rgba(0,113,227,0.15);color:#1d1d1f}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.1);border-radius:2px}

/* Nav */
nav{
  position:fixed;top:0;left:0;right:0;z-index:1000;height:48px;
  background:rgba(255,255,255,0.72);
  backdrop-filter:blur(40px) saturate(1.5);
  -webkit-backdrop-filter:blur(40px) saturate(1.5);
  border-bottom:1px solid rgba(0,0,0,0.04);
  display:flex;align-items:center;padding:0 24px;
}
.nav-inner{max-width:1024px;width:100%;margin:0 auto;display:flex;align-items:center;justify-content:space-between}
.nav-brand{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;letter-spacing:0.2px;color:#1d1d1f}
.nav-brand svg{width:15px;height:15px;opacity:0.5}
.nav-status{font-size:12px;font-weight:500;color:#86868b;font-variant-numeric:tabular-nums}
.nav-status.error{color:#ff3b30}
.nav-status.ok{color:#30d158}

/* Hero */
.hero{
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:100px 24px 60px;
  background:linear-gradient(180deg,#f5f5f7 0%,#fff 40%);
}
.hero-inner{display:flex;flex-direction:column;align-items:center;max-width:600px;width:100%}
.hero-label{font-size:12px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:#86868b;margin-bottom:20px}
.hero-title{font-size:clamp(48px,10vw,96px);font-weight:700;letter-spacing:-0.04em;line-height:0.95;text-align:center;margin-bottom:16px;color:#1d1d1f}
.hero-title .thin{font-weight:400;color:#86868b}
.hero-sub{font-size:clamp(16px,1.6vw,20px);color:#86868b;text-align:center;line-height:1.6;max-width:440px;margin-bottom:40px;font-weight:400}

/* Scan Card */
.scan-card{width:100%;padding:24px;background:#fff;border-radius:20px;box-shadow:0 2px 20px rgba(0,0,0,0.04),0 1px 3px rgba(0,0,0,0.02);border:1px solid rgba(0,0,0,0.04)}
.input-group{display:flex;gap:8px;width:100%}
.input-group input{flex:1;height:48px;padding:0 18px;background:#f5f5f7;border:1px solid transparent;border-radius:12px;color:#1d1d1f;font-size:14px;font-family:inherit;outline:none;transition:border-color 0.2s,background 0.2s}
.input-group input::placeholder{color:#aeaeb2}
.input-group input:focus{border-color:#0071e3;background:#fff}
.input-group button{height:48px;padding:0 24px;background:#0071e3;color:#fff;border:none;border-radius:12px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;transition:opacity 0.2s,transform 0.15s;display:flex;align-items:center;gap:6px;white-space:nowrap}
.input-group button:hover{opacity:0.85}
.input-group button:active{transform:scale(0.97)}
.input-group button:disabled{opacity:0.3;cursor:not-allowed;transform:none}
.input-group button.scanning svg{animation:spin 1s linear infinite}

/* Proxy Badge */
.proxy-badge{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:11px;color:#86868b;flex-wrap:wrap}
.proxy-badge .dot{width:5px;height:5px;border-radius:50%;background:#aeaeb2;display:inline-block;flex-shrink:0}
.proxy-badge .dot.active{background:#30d158}
.proxy-badge .dot.error{background:#ff3b30}
.proxy-badge .change{color:#0071e3;cursor:pointer;text-decoration:none}
.proxy-badge .change:hover{text-decoration:underline}

/* Proxy config panel */
.proxy-config{display:none;width:100%;margin-top:8px;padding:12px;background:#f5f5f7;border-radius:12px;}
.proxy-config.show{display:block}
.proxy-config input{width:100%;height:36px;padding:0 12px;background:#fff;border:1px solid rgba(0,0,0,0.08);border-radius:8px;font-size:12px;font-family:inherit;outline:none;margin-bottom:6px}
.proxy-config input:focus{border-color:#0071e3}
.proxy-config .hint{font-size:10px;color:#aeaeb2;line-height:1.4}
.proxy-config .presets{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.proxy-config .presets span{padding:3px 10px;background:#fff;border:1px solid rgba(0,0,0,0.06);border-radius:20px;font-size:10px;color:#86868b;cursor:pointer;transition:background 0.2s}
.proxy-config .presets span:hover{background:#e8e8ed}

/* Error banner */
.error-banner{display:none;width:100%;margin-top:12px;padding:12px 16px;background:#fff2f0;border:1px solid #ffccc7;border-radius:12px;font-size:12px;color:#ff3b30;line-height:1.5}
.error-banner.show{display:block}
.error-banner .btn{padding:4px 14px;background:#ff3b30;color:#fff;border:none;border-radius:20px;font-size:11px;cursor:pointer;font-family:inherit;margin-top:6px;display:inline-block}
.error-banner .btn:hover{opacity:0.85}

/* Progress */
.progress-area{display:none;width:100%;margin-top:16px}
.progress-area.show{display:block}
.progress-bar-track{width:100%;height:2px;background:rgba(0,0,0,0.05);border-radius:2px;overflow:hidden}
.progress-bar-fill{height:100%;width:0%;background:linear-gradient(90deg,#0071e3,#40b4ff);border-radius:2px;transition:width 0.3s ease}
.progress-text{display:flex;justify-content:space-between;font-size:11px;color:#aeaeb2;margin-top:6px;font-variant-numeric:tabular-nums}

/* Address Section */
.address-section{display:none;max-width:960px;margin:0 auto;padding:0 24px 24px}
.address-section.show{display:block}
.address-card{background:#fff;border-radius:20px;box-shadow:0 2px 20px rgba(0,0,0,0.04);border:1px solid rgba(0,0,0,0.04);padding:28px 32px;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:start}
.address-meta{font-size:12px;color:#aeaeb2;letter-spacing:0.5px;text-transform:uppercase;margin-bottom:8px}
.address-ip{font-size:28px;font-weight:700;letter-spacing:-0.03em;color:#1d1d1f;margin-bottom:4px;word-break:break-all}
.address-detail{font-size:16px;color:#86868b;line-height:1.5}
.address-detail strong{color:#1d1d1f;font-weight:500}
.address-coord{font-size:12px;color:#aeaeb2;font-family:'SF Mono','Menlo','Consolas',monospace;margin-top:8px}
.address-stats{display:flex;gap:20px;align-items:center;padding:12px 20px;background:#f5f5f7;border-radius:12px;white-space:nowrap}
.address-stats-item{text-align:center}
.address-stats-item .num{font-size:22px;font-weight:700;letter-spacing:-0.02em;color:#1d1d1f}
.address-stats-item .label{font-size:11px;color:#86868b;margin-top:2px}

/* Map */
.map-section{display:none;max-width:960px;margin:0 auto;padding:0 24px 24px}
.map-section.show{display:block}
.map-container{width:100%;height:520px;border-radius:20px;overflow:hidden;box-shadow:0 2px 20px rgba(0,0,0,0.04);border:1px solid rgba(0,0,0,0.04);position:relative}
#map{width:100%;height:100%}
.map-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#f5f5f7;color:#aeaeb2;font-size:13px;z-index:500;transition:opacity 0.5s}
.map-loading.hide{opacity:0;pointer-events:none}

/* Leaflet */
.leaflet-popup-content-wrapper{border-radius:14px!important;box-shadow:0 4px 24px rgba(0,0,0,0.08)!important;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif!important}
.leaflet-popup-content{margin:12px 16px!important;font-size:13px!important;line-height:1.5!important}
.leaflet-popup-content .popup-ip{font-weight:600;font-size:15px;margin-bottom:2px}
.leaflet-popup-content .popup-loc{color:#86868b;font-size:12px}
.leaflet-popup-content .popup-detail{color:#1d1d1f;font-size:13px;margin-top:4px;padding-top:4px;border-top:1px solid rgba(0,0,0,0.06)}

/* Grid */
.grid-section{display:none;max-width:600px;margin:0 auto;padding:0 24px 80px}
.grid-section.show{display:block}
.grid-header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.grid-header h2{font-size:14px;font-weight:600;color:#86868b}
.grid-header span{font-size:11px;color:#aeaeb2}
.grid-legend{display:flex;gap:12px;margin-bottom:8px}
.grid-legend-item{display:flex;align-items:center;gap:4px;font-size:10px;color:#aeaeb2}
.grid-legend-dot{width:6px;height:6px;border-radius:2px}
.grid-legend-dot.empty{background:#f0f0f2}
.grid-legend-dot.found{background:#0071e3}
.grid-legend-dot.error{background:#f0f0f2}
.ip-grid-wrapper{background:#fff;border-radius:16px;padding:12px;box-shadow:0 2px 20px rgba(0,0,0,0.04);border:1px solid rgba(0,0,0,0.04)}
.ip-grid{display:grid;grid-template-columns:repeat(16,1fr);gap:3px}
.ip-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:#f5f5f7;border-radius:3px;font-size:8px;font-weight:500;color:#aeaeb2;font-family:'SF Mono','Menlo','Consolas',monospace;cursor:pointer;user-select:none;transition:background 0.2s,color 0.2s,transform 0.15s}
.ip-cell:hover{background:#e8e8ed;transform:scale(1.12);z-index:2}
.ip-cell.found{background:#0071e3;color:#fff}
.ip-cell.error{background:#f5f5f7;color:#d1d1d6}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.address-card,.map-container,.ip-grid-wrapper{animation:fadeUp 0.5s ease-out}

@media(max-width:768px){
  .hero{padding:80px 20px 40px}
  .hero-title{font-size:clamp(36px,12vw,56px)}
  .scan-card{padding:16px;border-radius:16px}
  .address-card{padding:20px;grid-template-columns:1fr}
  .address-stats{padding:10px 16px;justify-content:center}
  .address-stats-item .num{font-size:18px}
  .map-container{height:360px;border-radius:16px}
  .ip-grid{gap:2px;grid-template-columns:repeat(16,1fr)}
  .ip-cell{font-size:6px;border-radius:2px}
  .grid-section{padding:0 16px 60px}
}
@media(max-width:480px){
  .input-group{flex-direction:column}
  .address-ip{font-size:20px}
  .map-container{height:280px}
  .ip-cell{font-size:5px}
}
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <div class="nav-brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/>
        <line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/>
        <line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/>
      </svg>
      <span>IP 邻居</span>
    </div>
    <div class="nav-status" id="navStatus">等待扫描</div>
  </div>
</nav>

<section class="hero" id="hero">
  <div class="hero-inner">
    <div class="hero-label">C 段网络地址扫描</div>
    <h1 class="hero-title">IP <span class="thin">邻居</span></h1>
    <p class="hero-sub">输入任意 IP 地址，扫描全部 256 个邻居节点，在地图上可视化呈现</p>
    <div class="scan-card">
      <div class="input-group">
        <input type="text" id="ipInput" placeholder="输入 IP，如 54.70.174.10" spellcheck="false" autocomplete="off">
        <button id="scanBtn" onclick="startScan()">
          <span id="scanBtnText">扫描</span>
          <svg id="scanBtnIcon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" style="display:none">
            <line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/>
            <line x1="4.93" y1="4.93" x2="7.76" y2="7.76"/><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"/>
            <line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/>
          </svg>
        </button>
      </div>
      <div class="proxy-badge" id="proxyBadge">
        <span class="dot" id="proxyDot"></span>
        <span id="proxyLabel">检测代理中...</span>
        <a class="change" id="proxyToggle" onclick="toggleProxyConfig()">更换</a>
      </div>
      <div class="proxy-config" id="proxyConfig">
        <input type="text" id="proxyInput" placeholder="自定义代理地址，留空自动选择" spellcheck="false">
        <div class="presets">
          <span onclick="setProxy('https://corsproxy.io/?')">corsproxy.io</span>
          <span onclick="setProxy('https://api.allorigins.win/raw?url=')">allorigins</span>
          <span onclick="setProxy('')">自动选择</span>
        </div>
        <div class="hint">某些公共代理可能被限速，如扫描太慢可尝试切换</div>
      </div>
      <div class="error-banner" id="errorBanner">
        <span id="errorText">扫描失败</span>
        <div><span class="btn" onclick="retryScan()">重试</span></div>
      </div>
      <div class="progress-area" id="progressArea">
        <div class="progress-bar-track"><div class="progress-bar-fill" id="progressFill"></div></div>
        <div class="progress-text">
          <span>已扫描 <span id="scannedCount">0</span>/256</span>
          <span>发现 <span id="foundCount">0</span> 个邻居</span>
        </div>
      </div>
    </div>
  </div>
</section>

<section class="address-section" id="addressSection"><div id="addressBody"></div></section>

<section class="map-section" id="mapSection">
  <div class="map-container">
    <div class="map-loading" id="mapLoading">加载地图中...</div>
    <div id="map"></div>
  </div>
</section>

<section class="grid-section" id="gridSection">
  <div class="grid-header"><h2>邻域网格</h2><span id="gridCount">256 个地址</span></div>
  <div class="grid-legend">
    <div class="grid-legend-item"><div class="grid-legend-dot empty"></div>无响应</div>
    <div class="grid-legend-item"><div class="grid-legend-dot found"></div>在线</div>
  </div>
  <div class="ip-grid-wrapper"><div class="ip-grid" id="ipGrid"></div></div>
</section>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin></script>
<script>
// ==================== CONFIG ====================
const PROXIES = [
  'https://corsproxy.io/?',
  'https://api.allorigins.win/raw?url=',
];
const CONCURRENCY = 10;
const TIMEOUT_MS = 5000;
let activeProxy = '';

// ==================== STATE ====================
const state = {
  prefix: '', ips: [],
  results: new Array(256).fill(null),
  cellStatus: new Array(256).fill('empty'),
  scanning: false, foundCount: 0,
  sameCityMap: {}, ipDetailCache: {},
};
let mapInstance = null, mapMarkers = [];

const $ = id => document.getElementById(id);
const dom = {
  grid: $('ipGrid'), input: $('ipInput'), scanBtn: $('scanBtn'),
  scanBtnText: $('scanBtnText'), scanBtnIcon: $('scanBtnIcon'),
  progressArea: $('progressArea'), progressFill: $('progressFill'),
  scannedCount: $('scannedCount'), foundCount: $('foundCount'),
  navStatus: $('navStatus'), gridCount: $('gridCount'),
  addressSection: $('addressSection'), addressBody: $('addressBody'),
  mapSection: $('mapSection'), mapLoading: $('mapLoading'),
  errorBanner: $('errorBanner'), errorText: $('errorText'),
  proxyBadge: $('proxyBadge'), proxyDot: $('proxyDot'), proxyLabel: $('proxyLabel'),
  proxyConfig: $('proxyConfig'), proxyInput: $('proxyInput'),
};

// ==================== PROXY ====================
async function findWorkingProxy() {
  const custom = dom.proxyInput.value.trim();
  const candidates = custom ? [custom] : PROXIES;
  for (const p of candidates) {
    try {
      const url = p + encodeURIComponent('https://apimobile.meituan.com/locate/v2/ip/loc?rgeo=true&ip=8.8.8.8');
      const res = await fetch(url, { signal: AbortSignal.timeout(5000) });
      if (res.ok) {
        const text = await res.text();
        const data = JSON.parse(text);
        if (data && data.data) { activeProxy = p; return p; }
      }
    } catch {}
  }
  return '';
}

async function initProxy() {
  dom.proxyLabel.textContent = '检测代理中...';
  dom.proxyDot.className = 'dot';
  const p = await findWorkingProxy();
  if (p) {
    dom.proxyDot.className = 'dot active';
    dom.proxyLabel.textContent = `CORS 代理已启用`;
  } else {
    dom.proxyDot.className = 'dot error';
    dom.proxyLabel.textContent = `未检测到可用代理，可手动配置`;
  }
}

function toggleProxyConfig() { dom.proxyConfig.classList.toggle('show'); }

async function setProxy(url) {
  dom.proxyInput.value = url;
  dom.proxyConfig.classList.remove('show');
  dom.proxyLabel.textContent = '检测代理中...';
  dom.proxyDot.className = 'dot';
  const p = await findWorkingProxy();
  if (p) {
    dom.proxyDot.className = 'dot active';
    dom.proxyLabel.textContent = `CORS 代理已启用`;
  } else {
    dom.proxyDot.className = 'dot error';
    dom.proxyLabel.textContent = `代理不可用，请重试`;
  }
}

function proxyUrl(raw) { return activeProxy ? activeProxy + encodeURIComponent(raw) : raw; }

// ==================== GRID ====================
function renderEmptyGrid() {
  dom.grid.innerHTML = '';
  for (let i = 0; i < 256; i++) {
    const cell = document.createElement('div');
    cell.className = 'ip-cell'; cell.dataset.index = i; cell.textContent = i;
    cell.addEventListener('click', () => focusMapToIP(i));
    dom.grid.appendChild(cell);
  }
}
function getCell(i) { return dom.grid.children[i]; }
function updateCell(i, s) {
  const c = getCell(i); if (!c) return;
  c.classList.remove('found','error');
  if (s === 'found') c.classList.add('found');
  else if (s === 'error') c.classList.add('error');
  state.cellStatus[i] = s;
}
function resetGrid() {
  for (let i = 0; i < 256; i++) { state.results[i] = null; updateCell(i, 'empty'); }
  state.foundCount = 0; state.sameCityMap = {};
}

// ==================== SCAN ====================
function parsePrefix(ip) {
  const p = ip.trim().split('.');
  if (p.length !== 4 || p.slice(0,3).some(x => isNaN(+x)||+x<0||+x>255)) return null;
  if (isNaN(+p[3])||+p[3]<0||+p[3]>255) return null;
  return p.slice(0,3).join('.');
}

async function startScan() {
  if (state.scanning) return;
  if (!activeProxy) { await initProxy(); if (!activeProxy) { showError('未找到可用代理，请配置 CORS 代理后重试'); return; } }
  const raw = dom.input.value.trim();
  const prefix = parsePrefix(raw);
  if (!prefix) { dom.input.style.borderColor='#ff3b30'; setTimeout(()=>dom.input.style.borderColor='',1500); return; }
  dom.input.style.borderColor = '';
  dom.errorBanner.classList.remove('show');
  state.prefix = prefix; state.scanning = true;
  state.ips = Array.from({length:256},(_,i)=>`${prefix}.${i}`);
  dom.scanBtnText.textContent='扫描中'; dom.scanBtnIcon.style.display='block';
  dom.scanBtn.classList.add('scanning'); dom.scanBtn.disabled=true;
  dom.progressArea.classList.add('show');
  dom.navStatus.textContent=`扫描 ${prefix}.0/24`;
  resetGrid();
  dom.addressSection.classList.remove('show');
  dom.mapSection.classList.remove('show');
  dom.gridSection.classList.add('show');
  clearMarkers();
  await scanAll();
  state.scanning=false;
  dom.scanBtnText.textContent='重新扫描'; dom.scanBtnIcon.style.display='none';
  dom.scanBtn.classList.remove('scanning'); dom.scanBtn.disabled=false;
  if (state.foundCount>0){
    dom.navStatus.textContent=`扫描完成 · ${state.foundCount} 个邻居在线`;
    dom.navStatus.className='ok';
    await plotMap();
    showFirstAddress();
    dom.addressSection.classList.add('show');
    dom.mapSection.classList.add('show');
    setTimeout(()=>{if(mapInstance)mapInstance.invalidateSize()},200);
  } else {
    dom.navStatus.textContent='⚠ 未发现在线节点';
    dom.navStatus.className='error';
    showError('未发现在线节点，可能是代理不可用，请尝试切换代理');
  }
}

async function scanAll() {
  let idx=0, found=0;
  async function worker() {
    while(idx<256){
      const i=idx++, ip=state.ips[i];
      updateCell(i,'found'); updateStats(i,found);
      const r = await scanSingle(ip);
      if(r&&r.data){
        state.results[i]=r; updateCell(i,'found'); found++;
        state.foundCount=found;
        const city=r.data.rgeo?.city||r.data.rgeo?.province||'';
        if(city){if(!state.sameCityMap[city])state.sameCityMap[city]=[];state.sameCityMap[city].push(i);}
      } else updateCell(i,'error');
      updateStats(i+1,found);
    }
  }
  await Promise.all(Array.from({length:CONCURRENCY},()=>worker()));
}

async function scanSingle(ip) {
  const url = proxyUrl(`https://apimobile.meituan.com/locate/v2/ip/loc?rgeo=true&ip=${ip}&_=${Date.now()}`);
  try {
    const res = await fetch(url, { signal: AbortSignal.timeout(TIMEOUT_MS) });
    if(!res.ok)return null;
    const t=await res.text();
    try{return JSON.parse(t)}catch{return null}
  }catch{return null}
}

async function fetchDetail(lat, lng) {
  const k=`${lat},${lng}`;
  if(state.ipDetailCache[k])return state.ipDetailCache[k];
  const url = proxyUrl(`https://apimobile.meituan.com/group/v1/city/latlng/${lat},${lng}?tag=0&_=${Date.now()}`);
  try{const r=await fetch(url);const t=await r.text();const d=JSON.parse(t);if(d&&d.data){state.ipDetailCache[k]=d.data;return d.data}}catch{}
  return null;
}

// ==================== UI ====================
function updateStats(s,f){
  dom.progressFill.style.width=Math.min(100,Math.round(s/256*100))+'%';
  dom.scannedCount.textContent=Math.min(s,256);
  dom.foundCount.textContent=f;
  dom.gridCount.textContent=`256 个地址 · ${f} 个在线`;
  dom.navStatus.textContent=state.scanning?`扫描 ${state.prefix}.0/24 · ${f} 个邻居`:`扫描完成 · ${f} 个邻居在线`;
}
function showError(msg){
  dom.errorText.textContent=msg;
  dom.errorBanner.classList.add('show');
}
function retryScan(){dom.errorBanner.classList.remove('show');startScan();}

// ==================== ADDRESS ====================
async function showFirstAddress(){
  for(let i=0;i<256;i++){if(state.results[i]?.data){await showAddress(i);break}}
}
async function showAddress(index){
  const r=state.results[index]; if(!r?.data)return;
  const d=r.data,rg=d.rgeo||{},ip=state.ips[index];
  let det=null;
  if(d.lat!=null&&d.lng!=null) det=await fetchDetail(d.lat,d.lng);
  dom.addressBody.innerHTML=`
    <div class="address-card">
      <div>
        <div class="address-meta">当前位置 · ${rg.country||''}</div>
        <div class="address-ip">${ip}</div>
        <div class="address-detail">
          ${rg.country||''} ${rg.province||''} ${rg.city||''} ${rg.district||''}
          ${det&&det.detail?`<br><strong>${det.detail}</strong>`:''}
          ${det&&det.areaName?`<span style="color:#86868b"> · ${det.areaName}</span>`:''}
        </div>
        <div class="address-coord">${d.lat!=null?d.lat:''}${d.lng!=null?`, ${d.lng}`:''}</div>
      </div>
      <div class="address-stats">
        <div class="address-stats-item"><div class="num">${state.foundCount}</div><div class="label">邻居节点</div></div>
        <div class="address-stats-item"><div class="num">${Object.keys(state.sameCityMap).length}</div><div class="label">覆盖城市</div></div>
      </div>
    </div>`;
}

// ==================== MAP ====================
async function plotMap(){
  dom.mapLoading.classList.remove('hide');
  if(!mapInstance){
    await new Promise(r=>setTimeout(r,100));
    mapInstance = L.map('map',{center:[35,105],zoom:4,zoomControl:true,attributionControl:false});
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(mapInstance);
    setTimeout(()=>mapInstance.invalidateSize(),200);
  }
  clearMarkers();
  const pts=[];
  for(let i=0;i<256;i++){
    const r=state.results[i]; if(!r?.data)continue;
    const d=r.data; if(d.lat==null||d.lng==null)continue;
    const lat=+d.lat,lng=+d.lng;
    const rg=d.rgeo||{},ip=state.ips[i];
    const addr=`${rg.province||''}${rg.city||''}${rg.district||''}`;
    const mkr=L.circleMarker([lat,lng],{radius:7,color:'#0071e3',fillColor:'#0071e3',fillOpacity:0.7,weight:1.5}).addTo(mapInstance);
    mkr.bindPopup(`<div class="popup-ip">${ip}</div><div class="popup-loc">${addr||'未知位置'}</div>`);
    mkr.on('click',async()=>{
      const det=await fetchDetail(lat,lng);
      mkr.setPopupContent(`<div class="popup-ip">${ip}</div><div class="popup-loc">${addr||'未知位置'}</div>${det?`<div class="popup-detail">${det.detail||''}${det.areaName?' · '+det.areaName:''}</div>`:''}`).openPopup();
      showAddress(i); highlightCell(i);
    });
    mapMarkers.push(mkr); pts.push([lat,lng]);
  }
  if(pts.length>1) mapInstance.fitBounds(L.latLngBounds(pts),{padding:[40,40],maxZoom:12});
  else if(pts.length===1) mapInstance.setView(pts[0],13);
  dom.mapLoading.classList.add('hide');
}

function clearMarkers(){mapMarkers.forEach(m=>mapInstance?.removeLayer(m));mapMarkers=[];}
function focusMapToIP(i){
  const r=state.results[i]; if(!r?.data)return;
  const lat=+r.data.lat,lng=+r.data.lng;
  if(isNaN(lat)||isNaN(lng))return;
  if(!mapInstance)return;
  mapInstance.setView([lat,lng],15,{animate:true});
  showAddress(i); highlightCell(i);
  dom.addressSection.classList.add('show');
  dom.mapSection.classList.add('show');
  dom.addressSection.scrollIntoView({behavior:'smooth',block:'start'});
}
function highlightCell(i){
  const c=getCell(i); if(!c)return;
  c.style.transform='scale(1.2)';c.style.boxShadow='0 0 0 2px #0071e3';
  setTimeout(()=>{c.style.transform='';c.style.boxShadow=''},1500);
}

// ==================== INIT ====================
renderEmptyGrid();
dom.input.addEventListener('keydown',e=>{if(e.key==='Enter')startScan()});
dom.input.focus();
initProxy();
</script>
</body>
